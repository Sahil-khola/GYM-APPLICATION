services:
  - type: web
    name: gym-backend
    runtime: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SERVICE
        value: gmail
      - key: EMAIL
        sync: false
      - key: PASSWORD
        sync: false

  - type: static
    name: gym-frontend
    rootDir: Frontend
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
