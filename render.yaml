services:
  - type: web
    name: gym-app
    runtime: node
    buildCommand: npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SERVICE
        value: gmail
      - key: EMAIL
        sync: false
      - key: PASSWORD
        sync: false
